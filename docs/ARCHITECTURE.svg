<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">FootballOS prototype system architecture</title>
  <desc id="desc">A GitHub repository is built and tested by GitHub Actions and published to GitHub Pages. The coach's browser runs a static React app with a hash router, a session reducer, deterministic logic, authored demo data, local storage, a film stage and a JSON session export. There is no server, API or model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font-size: 14px; font-weight: 500; }
    .t  { font-size: 14px; font-weight: 400; }
    .ts { font-size: 12px; font-weight: 400; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .neutral  { fill: #F9F8F4; stroke: #B4B2A9; }
    .neutral .th, .neutral .t { fill: #2C2C2A; }
    .neutral .ts { fill: #5F5E5A; }
    .purple { fill: #EEEDFE; stroke: #534AB7; }
    .purple .th { fill: #3C3489; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .th { fill: #085041; }
    .teal .ts { fill: #0F6E56; }
    .gray { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .th { fill: #444441; }
    .gray .ts { fill: #5F5E5A; }
    .legend { fill: #5F5E5A; }
  </style>
  <rect width="680" height="550" fill="#FFFFFF"/>

  <g class="neutral">
    <rect x="40" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="58" text-anchor="middle" dominant-baseline="central">GitHub repository</text>
    <text class="ts" x="130" y="78" text-anchor="middle" dominant-baseline="central">footballos-prototype</text>
  </g>
  <line x1="222" y1="68" x2="246" y2="68" class="arr" marker-end="url(#arrow)"/>
  <g class="neutral">
    <rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
    <text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">typecheck, test, build</text>
  </g>
  <line x1="432" y1="68" x2="456" y2="68" class="arr" marker-end="url(#arrow)"/>
  <g class="neutral">
    <rect x="460" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="58" text-anchor="middle" dominant-baseline="central">GitHub Pages</text>
    <text class="ts" x="550" y="78" text-anchor="middle" dominant-baseline="central">static site host</text>
  </g>
  <line x1="550" y1="98" x2="550" y2="136" class="arr" marker-end="url(#arrow)"/>

  <g class="purple">
    <rect x="40" y="140" width="600" height="285" rx="20" stroke-width="0.5"/>
    <text class="th" x="60" y="165" dominant-baseline="central">Coach's browser (static React app)</text>
  </g>

  <g class="teal">
    <rect x="60" y="185" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="145" y="203" text-anchor="middle" dominant-baseline="central">Hash router</text>
    <text class="ts" x="145" y="223" text-anchor="middle" dominant-baseline="central">#/, #/demo, #/research</text>
  </g>
  <line x1="232" y1="213" x2="248" y2="213" class="arr" marker-end="url(#arrow)"/>
  <g class="teal">
    <rect x="250" y="185" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="203" text-anchor="middle" dominant-baseline="central">App shell and reducer</text>
    <text class="ts" x="340" y="223" text-anchor="middle" dominant-baseline="central">React 19, eight screens</text>
  </g>
  <line x1="432" y1="213" x2="448" y2="213" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g class="gray">
    <rect x="450" y="185" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="535" y="203" text-anchor="middle" dominant-baseline="central">Local storage</text>
    <text class="ts" x="535" y="223" text-anchor="middle" dominant-baseline="central">session and exposure</text>
  </g>

  <path d="M340 243 L340 253 L185 253 L185 263" class="arr" marker-end="url(#arrow)"/>
  <path d="M340 243 L340 253 L495 253 L495 263" class="arr" marker-end="url(#arrow)"/>

  <g class="teal">
    <rect x="60" y="265" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="185" y="283" text-anchor="middle" dominant-baseline="central">Deterministic logic</text>
    <text class="ts" x="185" y="303" text-anchor="middle" dominant-baseline="central">film check, practice focus, summary</text>
  </g>
  <g class="gray">
    <rect x="370" y="265" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="495" y="283" text-anchor="middle" dominant-baseline="central">Authored demo data</text>
    <text class="ts" x="495" y="303" text-anchor="middle" dominant-baseline="central">6 plays, team, reasons, clips</text>
  </g>

  <line x1="185" y1="323" x2="185" y2="343" class="arr" marker-end="url(#arrow)"/>
  <line x1="495" y1="323" x2="495" y2="343" class="arr" marker-end="url(#arrow)"/>

  <g class="teal">
    <rect x="60" y="345" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="185" y="363" text-anchor="middle" dominant-baseline="central">Session export</text>
    <text class="ts" x="185" y="383" text-anchor="middle" dominant-baseline="central">JSON download or clipboard</text>
  </g>
  <g class="teal">
    <rect x="370" y="345" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="495" y="363" text-anchor="middle" dominant-baseline="central">Film stage</text>
    <text class="ts" x="495" y="383" text-anchor="middle" dominant-baseline="central">demo clips or local file</text>
  </g>

  <g class="neutral">
    <rect x="40" y="450" width="600" height="44" rx="8" stroke-width="0.5"/>
    <text class="t" x="340" y="472" text-anchor="middle" dominant-baseline="central">No server, API or model. Nothing leaves the browser.</text>
  </g>

  <text class="ts legend" x="340" y="524" text-anchor="middle" dominant-baseline="central">Teal: runtime code · Gray: data and storage</text>
</svg>
